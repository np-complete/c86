name: deploy
on:
  pull_request_target:
    types: closed
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: np-complete/book-actions/build@54a66681bda0372e196af77d110ead0ed2b1c30c # v1
      - uses: np-complete/book-actions/publish@54a66681bda0372e196af77d110ead0ed2b1c30c # v1
